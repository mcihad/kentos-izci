syntax = "proto3";

package izci.ingest.v1;

import "google/protobuf/timestamp.proto";
import "izci/ingest/v1/event.proto";

// IngestService receives events and release metadata from applications.
//
// # Transports
//
// The service is served by connect-go on the izci listener, so one endpoint
// speaks three protocols:
//
//   - native gRPC over HTTP/2 (TLS, or cleartext h2c with prior knowledge),
//     for server-side applications (Go, .NET, Java, Rust, Dart, …);
//   - gRPC-Web, for browsers through gRPC-Web clients;
//   - the Connect protocol over HTTP/1.1 or HTTP/2 with binary or JSON
//     bodies, which also makes the service reachable with plain HTTP:
//
//       curl -X POST https://izci.example.com/izci.ingest.v1.IngestService/SendEvent \
//         -H 'Content-Type: application/json' \
//         -H 'Authorization: Bearer izk_…' \
//         -d '{"event":{"level":"LEVEL_ERROR","exceptions":[{"type":"TimeoutError","value":"upstream timed out"}]}}'
//
// All methods are unary. Requests may be compressed with gzip
// (grpc-encoding / Content-Encoding: gzip).
//
// # Authentication
//
// Every call carries a project API key (prefix "izk_") in one of these
// headers (gRPC metadata keys):
//
//   - authorization: Bearer izk_…
//   - x-izci-key: izk_…
//
// A key belongs to exactly one project, which determines where events are
// stored. Keys used from browsers should list the allowed origins in izci;
// requests from other origins are rejected.
//
// # Errors
//
// | Code               | Meaning                                              | Retry?                 |
// |--------------------|------------------------------------------------------|------------------------|
// | UNAUTHENTICATED    | missing, malformed, unknown or revoked key           | no                     |
// | PERMISSION_DENIED  | key lacks the ingest scope or the origin is not allowed | no                  |
// | INVALID_ARGUMENT   | request cannot be decoded or has no usable content   | no                     |
// | RESOURCE_EXHAUSTED | rate limit or monthly quota exceeded                 | yes, after RetryInfo   |
// | UNAVAILABLE        | server overloaded or temporarily unable to persist   | yes, with backoff      |
//
// RESOURCE_EXHAUSTED errors carry a google.rpc.RetryInfo detail with the
// delay after which the client may retry. SDKs must honor it and should drop
// (not queue indefinitely) events while rate limited.
//
// # Delivery semantics
//
// By default the server answers after the event was durably stored, and the
// response names the issue it was grouped into. Retrying with the same
// Event.event_id is safe: duplicates are acknowledged with
// EVENT_OUTCOME_DUPLICATE and not stored twice.
service IngestService {
  // SendEvent stores one event and returns the issue it was grouped into.
  //
  // Oversized fields are truncated rather than rejected; the result lists
  // what was trimmed in warnings.
  rpc SendEvent(SendEventRequest) returns (SendEventResponse);

  // SendEvents stores up to 100 events in one call. Results are returned in
  // request order. A failing event does not fail the batch: its result carries
  // the outcome and error instead. Rate limiting may apply to part of a batch.
  rpc SendEvents(SendEventsRequest) returns (SendEventsResponse);

  // RegisterRelease records metadata about a release (commit, repository,
  // deployment), typically called from CI after a build or deploy. izci uses
  // it to link issues to commits, to check out the exact code for AI
  // analysis and to detect regressions in new releases. Calling it again for
  // the same version updates the stored metadata.
  rpc RegisterRelease(RegisterReleaseRequest) returns (RegisterReleaseResponse);

  // GetClientConfig returns project settings an SDK should apply locally:
  // sampling, limits and extra fields to scrub. SDKs call it at startup and
  // may cache the result for cache_ttl.
  rpc GetClientConfig(GetClientConfigRequest) returns (GetClientConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// SendEventRequest carries one event.
message SendEventRequest {
  // The event to store. Required.
  Event event = 1;
}

// SendEventResponse reports what happened to the event.
message SendEventResponse {
  // Outcome of the event, including the issue it was grouped into.
  EventResult result = 1;
}

// SendEventsRequest carries a batch of events.
message SendEventsRequest {
  // Events to store, 1 to 100 per call. Keep a batch under 5 MiB.
  repeated Event events = 1;
}

// SendEventsResponse reports the outcome of every event of the batch.
message SendEventsResponse {
  // One result per request event, in request order.
  repeated EventResult results = 1;
}

// EventResult reports the outcome of one event.
message EventResult {
  // Event id as stored: the client-provided Event.event_id or the id the
  // server assigned when it was empty.
  string event_id = 1;

  // What happened to the event.
  EventOutcome outcome = 2;

  // Identifier (UUID) of the issue the event was grouped into. Empty unless
  // outcome is ACCEPTED or DUPLICATE.
  string issue_id = 3;

  // Short, human-friendly issue identifier, e.g. "KALEM-1A". Empty unless
  // outcome is ACCEPTED or DUPLICATE.
  string issue_short_id = 4;

  // Link to the issue in the izci web UI. Empty unless outcome is ACCEPTED
  // or DUPLICATE.
  string issue_url = 5;

  // True when this event created a new issue.
  bool issue_is_new = 6;

  // True when this event reopened a resolved issue (regression).
  bool issue_regressed = 7;

  // Why the event was not accepted, for outcomes other than ACCEPTED and
  // DUPLICATE, e.g. "rate limit exceeded" or "event has neither a message nor
  // an exception".
  string error = 8;

  // Non-fatal adjustments the server made, e.g. "exceptions[0].stacktrace:
  // 412 frames trimmed to 250" or "timestamp in the future replaced by
  // receive time".
  repeated string warnings = 9;
}

// EventOutcome is the fate of a submitted event.
enum EventOutcome {
  // Not set; never returned by the server.
  EVENT_OUTCOME_UNSPECIFIED = 0;
  // Stored (or, in asynchronous acknowledgement mode, queued for storage)
  // and grouped into an issue.
  EVENT_OUTCOME_ACCEPTED = 1;
  // An event with the same event_id was already stored for this project; it
  // was not stored again. The issue fields refer to the original event.
  EVENT_OUTCOME_DUPLICATE = 2;
  // Dropped by a project filter (e.g. an ignored environment or a discarded
  // issue).
  EVENT_OUTCOME_FILTERED = 3;
  // Dropped because the key, project or organization exceeded its rate
  // limit or monthly quota (batch calls only; single calls fail with
  // RESOURCE_EXHAUSTED instead).
  EVENT_OUTCOME_RATE_LIMITED = 4;
  // Rejected because it has no usable content (batch calls only; single
  // calls fail with INVALID_ARGUMENT instead).
  EVENT_OUTCOME_INVALID = 5;
}

// RegisterReleaseRequest describes a release of the project's application.
message RegisterReleaseRequest {
  // Release version exactly as reported in Event.release, e.g. "1.4.2".
  // Required. Max 200 characters.
  string version = 1;

  // Full git commit SHA the release was built from (40 hexadecimal
  // characters).
  string commit_sha = 2;

  // Repository of the commit, as "owner/name" or a URL, e.g.
  // "mcihad/kentos-kalem". Defaults to the repository linked to the project.
  string repository = 3;

  // Branch or tag the release was built from, e.g. "main" or "v1.4.2".
  string ref = 4;

  // Link to the release page or CI run.
  string url = 5;

  // When set, also records a deployment of this release to the environment,
  // e.g. "production".
  string environment = 6;

  // When the release was deployed (or built, when environment is empty).
  // Defaults to the time of the call.
  google.protobuf.Timestamp released_at = 7;

  // Who or what released it, e.g. "github-actions" or an email address.
  string released_by = 8;
}

// RegisterReleaseResponse confirms the stored release.
message RegisterReleaseResponse {
  // Identifier (UUID) of the release in izci.
  string release_id = 1;

  // True when the release did not exist before this call.
  bool created = 2;
}

// GetClientConfigRequest identifies the calling SDK.
message GetClientConfigRequest {
  // The calling SDK, for compatibility decisions and statistics.
  Sdk sdk = 1;

  // Environment the SDK runs in, e.g. "production".
  string environment = 2;
}

// GetClientConfigResponse holds settings an SDK should apply.
message GetClientConfigResponse {
  // Organization slug of the project, e.g. "kentos".
  string organization_slug = 1;

  // Project slug, e.g. "kalem".
  string project_slug = 2;

  // Project display name, e.g. "KentOS Kalem".
  string project_name = 3;

  // Fraction of events the SDK should send, 0.0–1.0 (1.0 sends everything).
  double sample_rate = 4;

  // Maximum number of breadcrumbs to keep per event.
  uint32 max_breadcrumbs = 5;

  // Maximum encoded size of one event in bytes; larger events are trimmed by
  // the server.
  uint32 max_event_bytes = 6;

  // Maximum number of events per SendEvents call.
  uint32 max_batch_size = 7;

  // Suggested upper bound of events per minute for this SDK instance. 0
  // means no specific limit.
  uint32 max_events_per_minute = 8;

  // Additional field names (case-insensitive substrings) the SDK should
  // scrub before sending, on top of the built-in list (password, secret,
  // token, authorization, cookie, …).
  repeated string scrub_fields = 9;

  // Whether the SDK should send the end user's IP address (User.ip_address).
  bool collect_ip = 10;

  // Current server time, for clock skew detection.
  google.protobuf.Timestamp server_time = 11;

  // How long (in seconds) the SDK may cache this configuration.
  uint32 cache_ttl_seconds = 12;
}
