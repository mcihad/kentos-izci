syntax = "proto3";

package izci.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "izci/api/v1/common.proto";

// OwnershipService manages who owns a project's issues: ownership rules in
// Sentry's syntax, an imported CODEOWNERS file, aliases that map "@login",
// "@org/team" or "#team" to members, and automatic assignment of new
// issues. It also names an issue's owners and its suspect commit, the
// commit that last changed the failing lines.
//
// Rules are evaluated in order, CODEOWNERS first and the project's own
// rules after it; the last matching rule decides automatic assignment.
service OwnershipService {
  // GetOwnership returns a project's ownership configuration. Requires
  // ROLE_VIEWER.
  rpc GetOwnership(GetOwnershipRequest) returns (GetOwnershipResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateOwnership changes the rules, the CODEOWNERS text or automatic
  // assignment; unset fields stay. An invalid rule line fails the call with
  // ERROR_REASON_INVALID_ARGUMENT on field "rules" and metadata "line",
  // "kind" (a RuleProblemKind name) and "value". CODEOWNERS text is stored
  // even with invalid lines, which Ownership.problems lists. Requires
  // ROLE_ADMIN.
  rpc UpdateOwnership(UpdateOwnershipRequest) returns (UpdateOwnershipResponse);

  // ImportCodeowners reads CODEOWNERS from the project's linked GitHub
  // repository (".github/CODEOWNERS", "CODEOWNERS" or "docs/CODEOWNERS" on
  // the default branch) and stores it. Fails with
  // ERROR_REASON_REPOSITORY_NOT_LINKED without a repository linked through
  // a GitHub connection, ERROR_REASON_NOT_FOUND when the repository has no
  // CODEOWNERS file and ERROR_REASON_INTEGRATION_FAILED when GitHub
  // refuses. Requires ROLE_ADMIN.
  rpc ImportCodeowners(ImportCodeownersRequest) returns (ImportCodeownersResponse);

  // ListOwnerAliases lists the organization's owner aliases. Requires
  // ROLE_VIEWER.
  rpc ListOwnerAliases(ListOwnerAliasesRequest) returns (ListOwnerAliasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetOwnerAlias maps an alias to members; an empty member list removes
  // it. Requires ROLE_ADMIN.
  rpc SetOwnerAlias(SetOwnerAliasRequest) returns (SetOwnerAliasResponse);

  // GetIssueOwners returns an issue's owners by its latest event and the
  // current rules, and its stored suspect commit. Requires ROLE_VIEWER.
  rpc GetIssueOwners(GetIssueOwnersRequest) returns (GetIssueOwnersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // FindSuspectCommit searches, or searches again, for an issue's suspect
  // commit: git blame, through GitHub, of the innermost in-app frames of
  // its latest event at the release's commit (the default branch when the
  // release has none). The result is stored. Requires ROLE_VIEWER.
  rpc FindSuspectCommit(FindSuspectCommitRequest) returns (FindSuspectCommitResponse);
}

// AutoAssign is how a project's new issues are assigned.
enum AutoAssign {
  // Not set; new issues stay unassigned.
  AUTO_ASSIGN_UNSPECIFIED = 0;
  // New issues stay unassigned.
  AUTO_ASSIGN_OFF = 1;
  // To the first member the deciding rule names, when the issue is
  // created (notifications already show the assignee).
  AUTO_ASSIGN_OWNERS = 2;
  // To the author of the suspect commit when they are a member (matched by
  // e-mail address, or by GitHub login through an "@login" alias),
  // otherwise like AUTO_ASSIGN_OWNERS. Runs right after the issue is
  // created, so notifications may go out before it.
  AUTO_ASSIGN_SUSPECT_COMMIT = 3;
}

// RuleProblemKind is what is wrong with a rule line.
enum RuleProblemKind {
  // Not set.
  RULE_PROBLEM_KIND_UNSPECIFIED = 0;
  // The line is not "type:pattern owner...".
  RULE_PROBLEM_KIND_SYNTAX = 1;
  // Unknown rule type (value); known are path, module, url, tags.<key>
  // and codeowners.
  RULE_PROBLEM_KIND_UNKNOWN_TYPE = 2;
  // The rule names no owner.
  RULE_PROBLEM_KIND_NO_OWNERS = 3;
  // An owner (value) is neither an e-mail address nor "@name" or "#team".
  RULE_PROBLEM_KIND_INVALID_OWNER = 4;
  // The pattern (value) cannot be compiled.
  RULE_PROBLEM_KIND_INVALID_PATTERN = 5;
  // More than 5000 rules, or more than 20 owners on a line.
  RULE_PROBLEM_KIND_TOO_MANY = 6;
}

// RuleProblem is an invalid line, skipped when matching.
message RuleProblem {
  // Where: "rules" or "codeowners".
  string field = 1;

  // Line number, 1-based.
  uint32 line = 2;

  // What is wrong.
  RuleProblemKind kind = 3;

  // The offending type, owner or pattern, when any.
  string value = 4;
}

// Codeowners is a project's CODEOWNERS file.
message Codeowners {
  // File content.
  string content = 1;

  // Where it was imported from, e.g. "kentos/kalem:.github/CODEOWNERS";
  // empty when pasted.
  string source = 2;

  // When it was imported or pasted.
  google.protobuf.Timestamp synced_at = 3;

  // Rules read from it.
  uint32 rule_count = 4;
}

// Ownership is a project's ownership configuration.
//
// Rule syntax, one rule per line ("#" starts a comment line):
//
//   path:src/billing/*        ayse@kentos.com.tr @mehmet
//   module:Kentos.Tahsilat.*  #tahsilat
//   url:*/odeme/*             ayse@kentos.com.tr
//   tags.customer:sivas       ali@kentos.com.tr
//   codeowners:/src/billing/  @kentos/billing
//
// "path" matches file paths of stack frames (relative patterns at any
// directory), "module" their modules, "url" the request URL, "tags.<key>"
// an event tag (also level, environment, release, transaction,
// server_name, logger, customer and tenant); "*" matches anything, case is
// ignored. "codeowners" uses CODEOWNERS patterns on repository paths.
message Ownership {
  // The project's own rules.
  string rules = 1;

  // The CODEOWNERS file; unset when none.
  Codeowners codeowners = 2;

  // How new issues are assigned.
  AutoAssign auto_assign = 3;

  // Owners that resolve to no member: e-mail addresses of non-members and
  // aliases without a mapping, lowercased.
  repeated string unmapped_owners = 4;

  // Invalid lines of the stored CODEOWNERS text (and rules saved before a
  // validation change).
  repeated RuleProblem problems = 5;

  // Rules in effect from the project's own rules.
  uint32 rule_count = 6;

  // Whether a repository is linked through a GitHub connection, which
  // importing CODEOWNERS and finding suspect commits need.
  bool github_linked = 7;

  // When the configuration last changed; unset when never saved.
  google.protobuf.Timestamp updated_at = 8;
}

// GetOwnershipRequest names a project.
message GetOwnershipRequest {
  // Project slug.
  string project = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

// GetOwnershipResponse returns the configuration.
message GetOwnershipResponse {
  // The configuration.
  Ownership ownership = 1;
}

// UpdateOwnershipRequest changes a configuration.
message UpdateOwnershipRequest {
  // Project slug.
  string project = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];

  // New rules; unchanged when unset.
  optional string rules = 2 [(buf.validate.field).string.max_bytes = 262144];

  // New assignment mode; unchanged when unset.
  optional AutoAssign auto_assign = 3 [(buf.validate.field).enum.defined_only = true];

  // New CODEOWNERS text, e.g. pasted from a repository GitHub cannot
  // reach; empty removes it; unchanged when unset.
  optional string codeowners = 4 [(buf.validate.field).string.max_bytes = 262144];
}

// UpdateOwnershipResponse returns the configuration.
message UpdateOwnershipResponse {
  // The updated configuration.
  Ownership ownership = 1;
}

// ImportCodeownersRequest names a project.
message ImportCodeownersRequest {
  // Project slug.
  string project = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

// ImportCodeownersResponse returns the configuration.
message ImportCodeownersResponse {
  // The configuration with the imported file.
  Ownership ownership = 1;
}

// OwnerAlias maps an owner name used in rules to members.
message OwnerAlias {
  // "@login" (a GitHub user), "@org/team" or "#team", lowercased.
  string alias = 1;

  // Members the alias stands for, in order; the first is assigned.
  repeated UserRef users = 2;

  // When the mapping last changed.
  google.protobuf.Timestamp updated_at = 3;
}

// ListOwnerAliasesRequest has no fields.
message ListOwnerAliasesRequest {}

// ListOwnerAliasesResponse lists aliases.
message ListOwnerAliasesResponse {
  // Aliases by name.
  repeated OwnerAlias aliases = 1;
}

// SetOwnerAliasRequest maps an alias.
message SetOwnerAliasRequest {
  // "@login", "@org/team" or "#team".
  string alias = 1 [(buf.validate.field).string.pattern = "^[@#][^\\s@#]{1,100}$"];

  // Member ids in order; empty removes the alias.
  repeated string user_ids = 2 [(buf.validate.field).repeated = {
    max_items: 50
    items: {string: {uuid: true}}
  }];
}

// SetOwnerAliasResponse returns the alias.
message SetOwnerAliasResponse {
  // The alias; unset when removed.
  OwnerAlias alias = 1;
}

// IssueOwner is a member who owns an issue.
message IssueOwner {
  // The member.
  UserRef user = 1;

  // Rules naming the member, e.g. "path:src/billing/*" or
  // "codeowners:/src/billing/"; the deciding rule first.
  repeated string rules = 2;

  // Whether automatic assignment by rules picks this member.
  bool suggested = 3;
}

// SuspectCommitState says whether an issue's suspect commit is known.
enum SuspectCommitState {
  // Not set.
  SUSPECT_COMMIT_STATE_UNSPECIFIED = 0;
  // No repository is linked through a GitHub connection.
  SUSPECT_COMMIT_STATE_NOT_CONFIGURED = 1;
  // Not searched yet: call FindSuspectCommit.
  SUSPECT_COMMIT_STATE_UNKNOWN = 2;
  // Found.
  SUSPECT_COMMIT_STATE_FOUND = 3;
  // The event has no stack frames with line numbers.
  SUSPECT_COMMIT_STATE_NO_FRAMES = 4;
  // The files of the frames are not in the repository at that commit.
  SUSPECT_COMMIT_STATE_NOT_IN_REPOSITORY = 5;
  // GitHub refused or failed; detail says why.
  SUSPECT_COMMIT_STATE_FAILED = 6;
}

// SuspectCommit is the commit that last changed the failing lines.
message SuspectCommit {
  // Whether it is known.
  SuspectCommitState state = 1;

  // Commit SHA.
  string sha = 2;

  // First line of the commit message.
  string message = 3;

  // Commit page on GitHub.
  string url = 4;

  // Author name as in the commit.
  string author_name = 5;

  // Author e-mail address as in the commit.
  string author_email = 6;

  // Author's GitHub login, when GitHub knows the address.
  string author_login = 7;

  // The member who wrote it, when the e-mail address or an "@login" alias
  // matches one.
  UserRef author = 8;

  // When it was committed.
  google.protobuf.Timestamp committed_at = 9;

  // Repository file whose line it changed.
  string path = 10;

  // Line number in that file.
  uint32 line = 11;

  // Why the search failed (FAILED; GitHub's message in English).
  string detail = 12;

  // When the search ran.
  google.protobuf.Timestamp computed_at = 13;
}

// GetIssueOwnersRequest names an issue.
message GetIssueOwnersRequest {
  // Issue id.
  string issue_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetIssueOwnersResponse returns owners and the suspect commit.
message GetIssueOwnersResponse {
  // Owners, those of the deciding rule first.
  repeated IssueOwner owners = 1;

  // Owners of matching rules that resolve to no member.
  repeated string unmapped_owners = 2;

  // The rule deciding automatic assignment, as written; empty when no rule
  // matches.
  string deciding_rule = 3;

  // The suspect commit.
  SuspectCommit suspect_commit = 4;
}

// FindSuspectCommitRequest names an issue.
message FindSuspectCommitRequest {
  // Issue id.
  string issue_id = 1 [(buf.validate.field).string.uuid = true];
}

// FindSuspectCommitResponse returns the result.
message FindSuspectCommitResponse {
  // The suspect commit, or why there is none.
  SuspectCommit suspect_commit = 1;
}
