syntax = "proto3";

package izci.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "izci/api/v1/auth.proto";
import "izci/api/v1/common.proto";

// UserService manages the signed-in user's own account: profile, personal
// access tokens, sessions, two-factor authentication and the linked
// Telegram account. It does not use the Izci-Org header.
service UserService {
  // UpdateProfile changes the display name.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // ListAccessTokens lists the user's personal access tokens.
  rpc ListAccessTokens(ListAccessTokensRequest) returns (ListAccessTokensResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateAccessToken creates a personal access token for the API, the CLI
  // and MCP clients. The secret is returned only once. A token never grants
  // more than the user's role in its organization.
  rpc CreateAccessToken(CreateAccessTokenRequest) returns (CreateAccessTokenResponse);

  // RevokeAccessToken revokes a token immediately.
  rpc RevokeAccessToken(RevokeAccessTokenRequest) returns (RevokeAccessTokenResponse);

  // ListSessions lists the user's active browser sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RevokeSession ends one of the user's sessions (or all other sessions).
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // CreateTelegramAccountLinkCode creates a one-time code (valid 15 minutes)
  // that links the user's Telegram account: send "/ben <code>" to the bot.
  rpc CreateTelegramAccountLinkCode(CreateTelegramAccountLinkCodeRequest) returns (CreateTelegramAccountLinkCodeResponse);

  // UnlinkTelegramAccount removes the linked Telegram account.
  rpc UnlinkTelegramAccount(UnlinkTelegramAccountRequest) returns (UnlinkTelegramAccountResponse);

  // BeginTwoFactorSetup starts turning on two-factor authentication: it
  // returns a new secret for an authenticator app, which EnableTwoFactor
  // confirms within an hour. Browser sessions only; fails with
  // ERROR_REASON_CONFLICT when two-factor authentication is on already.
  rpc BeginTwoFactorSetup(BeginTwoFactorSetupRequest) returns (BeginTwoFactorSetupResponse);

  // EnableTwoFactor confirms the setup with a code from the authenticator
  // app and turns two-factor authentication on. The response carries the
  // recovery codes, which are never shown again. Browser sessions only.
  rpc EnableTwoFactor(EnableTwoFactorRequest) returns (EnableTwoFactorResponse);

  // DisableTwoFactor turns two-factor authentication off, given a current
  // code or a recovery code. Organizations requiring it turn the user away
  // until it is on again. Browser sessions only.
  rpc DisableTwoFactor(DisableTwoFactorRequest) returns (DisableTwoFactorResponse);

  // RegenerateRecoveryCodes replaces the recovery codes, given a current
  // code; the old codes stop working. Browser sessions only.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);

  // ListNotifications lists the caller's personal notifications (issues
  // assigned to them, mentions, news about issues they follow) in the
  // organizations they belong to, newest first.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // MarkNotificationsRead marks the given notifications, or all of the
  // caller's, read.
  rpc MarkNotificationsRead(MarkNotificationsReadRequest) returns (MarkNotificationsReadResponse);

  // GetNotificationSettings returns where the caller's personal
  // notifications go besides the inbox.
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateNotificationSettings changes where the caller's personal
  // notifications go.
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse);

  // DeleteAccount deletes the caller's account: memberships, sessions,
  // access tokens and settings. Comments and other organization records
  // stay without the author. The only owner of an organization must hand it
  // over or delete it first (ERROR_REASON_LAST_OWNER); the last server
  // administrator cannot leave (ERROR_REASON_LAST_SUPERADMIN). Browser
  // sessions only, re-authenticated in the last 10 minutes.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

// UserNotificationKind is why a member is notified personally.
enum UserNotificationKind {
  // Not set.
  USER_NOTIFICATION_KIND_UNSPECIFIED = 0;
  // An issue was assigned to the member, by someone or by an ownership
  // rule.
  USER_NOTIFICATION_KIND_ASSIGNED = 1;
  // A comment named the member with "@".
  USER_NOTIFICATION_KIND_MENTIONED = 2;
  // An issue the member follows came back after it was resolved.
  USER_NOTIFICATION_KIND_REGRESSED = 3;
  // Someone commented on an issue the member follows.
  USER_NOTIFICATION_KIND_COMMENTED = 4;
}

// UserNotification is an entry of a member's notification inbox.
message UserNotification {
  // Notification id (UUID).
  string id = 1;

  // Why the member is notified.
  UserNotificationKind kind = 2;

  // Organization of the issue.
  OrganizationRef organization = 3;

  // The issue.
  IssueRef issue = 4;

  // Who caused the notification; unset when izci did (ownership rules,
  // regressions).
  UserRef actor = 5;

  // The comment (shortened) for mentions and comments; the reason of an
  // automatic assignment.
  string text = 6;

  // When it happened.
  google.protobuf.Timestamp created_at = 7;

  // The member has seen it.
  bool read = 8;
}

// ListNotificationsRequest pages through the caller's notifications.
message ListNotificationsRequest {
  // Page size, 1 to 100 (default 30).
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 100];

  // Token from the previous page.
  string page_token = 2 [(buf.validate.field).string.max_len = 200];

  // Only notifications not read yet.
  bool unread_only = 3;
}

// ListNotificationsResponse is a page of notifications.
message ListNotificationsResponse {
  // Notifications, newest first.
  repeated UserNotification notifications = 1;

  // Token of the next page; empty on the last one.
  string next_page_token = 2;

  // Unread notifications in total.
  uint32 unread_count = 3;
}

// MarkNotificationsReadRequest names notifications to mark read.
message MarkNotificationsReadRequest {
  // Notification ids; ignored when all is set.
  repeated string ids = 1 [(buf.validate.field).repeated = {
    max_items: 100
    items: {string: {uuid: true}}
  }];

  // Mark every notification of the caller read.
  bool all = 2;
}

// MarkNotificationsReadResponse reports what is left unread.
message MarkNotificationsReadResponse {
  // Unread notifications in total.
  uint32 unread_count = 1;
}

// NotificationChannels are where a kind of personal notification goes
// besides the inbox, which gets them all.
message NotificationChannels {
  // An e-mail to the account's address (needs SMTP on the server).
  bool email = 1;

  // A Telegram message from the bot (needs a linked Telegram account).
  bool telegram = 2;
}

// NotificationSettings choose the channels of each kind of personal
// notification.
message NotificationSettings {
  // Issues assigned to the member.
  NotificationChannels assigned = 1;

  // Mentions in comments.
  NotificationChannels mentioned = 2;

  // Followed issues that came back.
  NotificationChannels regressed = 3;

  // Comments on followed issues.
  NotificationChannels commented = 4;

  // How often a summary of the member's organizations comes by e-mail:
  // new, regressed and fastest growing issues. Unset means never.
  DigestFrequency digest = 5;
}

// GetNotificationSettingsRequest has no fields.
message GetNotificationSettingsRequest {}

// GetNotificationSettingsResponse returns the settings and what the
// server offers.
message GetNotificationSettingsResponse {
  // The settings; defaults for members who never changed them.
  NotificationSettings settings = 1;

  // The server sends e-mail (SMTP is configured).
  bool email_available = 2;

  // The server has a Telegram bot and the account is linked to it.
  bool telegram_available = 3;
}

// UpdateNotificationSettingsRequest replaces the settings.
message UpdateNotificationSettingsRequest {
  // The new settings.
  NotificationSettings settings = 1 [(buf.validate.field).required = true];
}

// UpdateNotificationSettingsResponse returns the stored settings.
message UpdateNotificationSettingsResponse {
  // The settings.
  NotificationSettings settings = 1;
}

// AccessToken is a personal access token.
message AccessToken {
  // Token id (UUID).
  string id = 1;

  // Descriptive name, e.g. "Claude Code on laptop".
  string name = 2;

  // First characters of the token, e.g. "izp_8c1d0e".
  string prefix = 3;

  // Organization the token is bound to; unset for tokens valid in all of
  // the user's organizations.
  OrganizationRef organization = 4;

  // Granted scopes.
  repeated TokenScope scopes = 5;

  // When the token was created.
  google.protobuf.Timestamp created_at = 6;

  // When the token was last used.
  google.protobuf.Timestamp last_used_at = 7;

  // When the token expires; unset for tokens without expiry.
  google.protobuf.Timestamp expires_at = 8;

  // Client address of the last use (recorded at most once a minute);
  // empty when unknown.
  string last_used_ip = 9;
}

// TokenScope is a permission of a personal access token.
enum TokenScope {
  // Not set.
  TOKEN_SCOPE_UNSPECIFIED = 0;
  // Read issues, events, customers, projects and dashboards.
  TOKEN_SCOPE_READ = 1;
  // Triage issues and comment (requires the member role).
  TOKEN_SCOPE_WRITE = 2;
  // Start AI runs and create branches or pull requests.
  TOKEN_SCOPE_AI = 3;
}

// SessionInfo describes a browser session.
message SessionInfo {
  // Session id.
  string id = 1;

  // Whether this is the session making the request.
  bool current = 2;

  // Client address that created the session.
  string ip_address = 3;

  // Browser and operating system, e.g. "Chrome 129 · macOS".
  string client = 4;

  // When the session was created.
  google.protobuf.Timestamp created_at = 5;

  // When the session was last used.
  google.protobuf.Timestamp last_seen_at = 6;

  // When the session expires unless used.
  google.protobuf.Timestamp expires_at = 7;
}

// UpdateProfileRequest changes the profile.
message UpdateProfileRequest {
  // New display name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// UpdateProfileResponse returns the user.
message UpdateProfileResponse {
  // The updated user.
  User user = 1;
}

// ListAccessTokensRequest has no fields.
message ListAccessTokensRequest {}

// ListAccessTokensResponse lists tokens.
message ListAccessTokensResponse {
  // Tokens, newest first.
  repeated AccessToken tokens = 1;
}

// CreateAccessTokenRequest describes the token.
message CreateAccessTokenRequest {
  // Descriptive name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];

  // Organization slug to bind the token to; empty for all organizations.
  string organization = 2 [(buf.validate.field).string.max_len = 50];

  // Scopes, at least one.
  repeated TokenScope scopes = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 3
  }];

  // Lifetime; unset or zero creates a token without expiry. Max 1 year.
  google.protobuf.Duration expires_in = 4;
}

// CreateAccessTokenResponse returns the token and its secret.
message CreateAccessTokenResponse {
  // The token.
  AccessToken token = 1;

  // The full token ("izp_…"). Shown only once.
  string secret = 2;
}

// RevokeAccessTokenRequest identifies a token.
message RevokeAccessTokenRequest {
  // Token id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeAccessTokenResponse has no fields.
message RevokeAccessTokenResponse {}

// ListSessionsRequest has no fields.
message ListSessionsRequest {}

// ListSessionsResponse lists sessions.
message ListSessionsResponse {
  // Sessions, most recently used first.
  repeated SessionInfo sessions = 1;
}

// RevokeSessionRequest identifies the sessions to end.
message RevokeSessionRequest {
  // Session id to end; empty together with all_others ends every session
  // except the current one.
  string id = 1;

  // End all sessions except the current one.
  bool all_others = 2;
}

// RevokeSessionResponse reports how many sessions ended.
message RevokeSessionResponse {
  // Number of ended sessions.
  uint32 revoked = 1;
}

// CreateTelegramAccountLinkCodeRequest has no fields.
message CreateTelegramAccountLinkCodeRequest {}

// CreateTelegramAccountLinkCodeResponse returns the code.
message CreateTelegramAccountLinkCodeResponse {
  // One-time code.
  string code = 1;

  // Bot username without "@".
  string bot_username = 2;

  // Link that opens a private chat with the bot with the command prefilled.
  string link = 3;

  // When the code expires.
  google.protobuf.Timestamp expires_at = 4;
}

// UnlinkTelegramAccountRequest has no fields.
message UnlinkTelegramAccountRequest {}

// UnlinkTelegramAccountResponse has no fields.
message UnlinkTelegramAccountResponse {}

// BeginTwoFactorSetupRequest has no fields.
message BeginTwoFactorSetupRequest {}

// BeginTwoFactorSetupResponse carries the secret for the authenticator app.
message BeginTwoFactorSetupResponse {
  // Secret in base32, for typing into the app when the QR code cannot be
  // scanned.
  string secret = 1;

  // otpauth:// URI (SHA-1, 6 digits, 30 seconds) to show as a QR code.
  string uri = 2;
}

// EnableTwoFactorRequest confirms the setup.
message EnableTwoFactorRequest {
  // Six-digit code the authenticator app shows for the new secret.
  string code = 1 [(buf.validate.field).string = {
    min_len: 6
    max_len: 16
  }];
}

// EnableTwoFactorResponse returns the recovery codes.
message EnableTwoFactorResponse {
  // Ten single-use recovery codes ("xxxxx-xxxxx") that sign in when the
  // authenticator app is lost. Shown only once.
  repeated string recovery_codes = 1;
}

// DisableTwoFactorRequest proves the second factor.
message DisableTwoFactorRequest {
  // Code from the authenticator app, or a recovery code.
  string code = 1 [(buf.validate.field).string = {
    min_len: 6
    max_len: 32
  }];
}

// DisableTwoFactorResponse has no fields.
message DisableTwoFactorResponse {}

// RegenerateRecoveryCodesRequest proves the second factor.
message RegenerateRecoveryCodesRequest {
  // Code from the authenticator app, or a recovery code.
  string code = 1 [(buf.validate.field).string = {
    min_len: 6
    max_len: 32
  }];
}

// RegenerateRecoveryCodesResponse returns the new recovery codes.
message RegenerateRecoveryCodesResponse {
  // Ten new single-use recovery codes. Shown only once.
  repeated string recovery_codes = 1;
}

// DeleteAccountRequest confirms the deletion of the caller's account.
message DeleteAccountRequest {
  // Must repeat the account's e-mail address, as a safeguard against
  // accidental deletion.
  string confirm_email = 1 [(buf.validate.field).string.max_len = 320];
}

// DeleteAccountResponse has no fields.
message DeleteAccountResponse {}

// DigestFrequency is how often the summary e-mail comes.
enum DigestFrequency {
  // Never.
  DIGEST_FREQUENCY_UNSPECIFIED = 0;
  // Every morning, covering the last 24 hours.
  DIGEST_FREQUENCY_DAILY = 1;
  // Monday mornings, covering the last 7 days.
  DIGEST_FREQUENCY_WEEKLY = 2;
}
