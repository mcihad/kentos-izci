# Dependency and container image scanning: on every push to main, every
# pull request and weekly, so that advisories published after a merge are
# found too. `make audit` runs the dependency checks locally.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Reports only vulnerabilities in code izci actually calls.
      - uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          cache-dependency-path: go.sum
          go-package: ./...

  web:
    name: Web dependencies (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Only what ships in the built UI; build tools are not served.
      - name: Audit production dependencies
        run: pnpm -C web audit --prod --audit-level high

  fuzz:
    name: Fuzz parsers
    # Weekly and on request: two minutes per parser of untrusted input.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go/go.sum
            sdk/go/izcipgx/go.sum
      - name: Fuzz
        run: make fuzz FUZZTIME=2m
      # Failing inputs belong in the package's testdata/fuzz, where every
      # go test runs them.
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  image:
    name: Container image (Trivy, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: izci:scan
          build-args: |
            VERSION=scan-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Scan the image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: izci:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: izci:scan
          format: spdx-json
          output-file: izci.spdx.json
          artifact-name: izci-sbom.spdx.json
