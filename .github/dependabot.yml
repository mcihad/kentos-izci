# Weekly dependency updates; minor and patch updates of one ecosystem come
# in a single pull request. Security updates (repository settings › Code
# security) arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/sdk/go", "/sdk/go/izcipgx"]
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
